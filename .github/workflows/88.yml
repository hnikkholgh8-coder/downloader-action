name: Manual Build and Release v4

on:
  workflow_dispatch:
    inputs:
      entrypoint:
        description: "آدرس فایل پایتون هدف برای کامپایل (مثال: app.py یا apps/app2.py)"
        required: true
        default: "app.py"
      packages:
        description: "لیست کتابخانه‌های پایتون جهت نصب (با فاصله جدا کنید)"
        required: true
        default: "pynput pystray Pillow Nuitka"
      nuitka_flags:
        description: "فلگ‌های کامپایل Nuitka"
        required: true
        default: "--standalone --onefile --windows-console-mode=disable --enable-plugins=tk-inter --assume-yes-for-downloads --output-filename=app"

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ۱. راه‌اندازی ابزار فوق‌سریع uv همراه با مدیریت خودکار پایتون ۳.۱۲ و کش پکیج‌ها
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.12"

      # ۲. کش کردن دایرکتوری ابزارها و کدهای کامپایل‌شده C مربوط به Nuitka
      - name: Cache Nuitka Compiler and downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/Nuitka/Nuitka/Cache
          key: ${{ runner.os }}-nuitka-${{ hashFiles('**/app.py') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      # ۳. نصب پکیج‌ها به صورت پویا بر اساس ورودی کاربر
      - name: Install Dependencies
        run: |
          echo "=== Creating virtual environment with uv ==="
          uv venv
          
          echo "=== Installing packages ==="
          uv pip install ${{ github.event.inputs.packages }}
          if (Test-Path requirements.txt) { 
             uv pip install -r requirements.txt
          }

      # ۴. کامپایل فشرده با استفاده از فایل و فلگ‌های تعیین شده توسط کاربر
      - name: Build with Nuitka
        run: |
          echo "=== Starting Nuitka Compilation ==="
          echo "Target File: ${{ github.event.inputs.entrypoint }}"
          echo "Nuitka Flags: ${{ github.event.inputs.nuitka_flags }}"
          
          .\.venv\Scripts\python -m nuitka ${{ github.event.inputs.nuitka_flags }} "${{ github.event.inputs.entrypoint }}"
          echo "Compilation finished."

      # ۵. آرتیفکت گیت‌هاب (کمربند ایمنی فعال - تحت هر شرایطی فایل اگزه در این بخش ذخیره می‌شود)
      - name: Save Build as Artifact (Safety Net)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app-build-${{ github.run_number }}
          path: "*.exe"
          retention-days: 90

      # ۶. ایجاد ریلیز نهایی در گیت‌هاب (همراه با نادیده گرفتن خطاهای امنیتی مخزن)
      - name: Create or Update Release
        uses: ncipollo/release-action@v1
        continue-on-error: true # سوپاپ اطمینان: در صورت محدودیت قوانین گیت‌هاب شما، کل پروسه با خطا مواجه نمی‌شود
        with:
          artifacts: "*.exe"
          tag: "build-${{ github.run_number }}"
          name: "Build #${{ github.run_number }}"
          body: |
             توضیحات ریلیز خودکار:
             - فایل ورودی: [${{ github.event.inputs.entrypoint }}]
             - کتابخانه‌های نصب‌شده: [${{ github.event.inputs.packages }}]
             - فلگ‌های استفاده شده: [${{ github.event.inputs.nuitka_flags }}]
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
