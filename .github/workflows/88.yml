name: Manual Build and Release v5


on:
  workflow_dispatch:
    inputs:
      entrypoint:
        description: "آدرس فایل پایتون هدف برای کامپایل (مثال: app.py یا apps/app2.py)"
        required: true
        default: "app.py"
      packages:
        description: "لیست کتابخانه‌های پایتون جهت نصب (با فاصله جدا کنید)"
        required: true
        default: "pynput pystray Pillow Nuitka"
      nuitka_flags:
        description: "فلگ‌های کامپایل Nuitka"
        required: true
        default: "--standalone --onefile --windows-console-mode=disable --enable-plugins=tk-inter --assume-yes-for-downloads --output-filename=app"

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ۱. تولید تگ کاملاً داینامیک بر اساس تاریخ و ساعت ثانیه ساخت
      - name: Generate Timestamp Tag
        id: tag_gen
        run: |
          $date_str = Get-Date -Format "yyyy.MM.dd-HHmmss"
          echo "TAG_NAME=v-$date_str" >> $env:GITHUB_ENV
        shell: powershell

      # ۲. راه‌اندازی ابزار فوق‌سریع uv همراه با مدیریت خودکار پایتون ۳.۱۲ و کش پکیج‌ها
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.12"

      # ۳. کش کردن دایرکتوری ابزارها و کدهای کامپایل‌شده C مربوط به Nuitka
      - name: Cache Nuitka Compiler and downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/Nuitka/Nuitka/Cache
          key: ${{ runner.os }}-nuitka-${{ hashFiles('**/app.py') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      # ۴. نصب پکیج‌ها به صورت پویا بر اساس ورودی کاربر
      - name: Install Dependencies
        run: |
          echo "=== Creating virtual environment with uv ==="
          uv venv
          
          echo "=== Installing packages ==="
          uv pip install ${{ github.event.inputs.packages }}
          if (Test-Path requirements.txt) { 
             uv pip install -r requirements.txt
          }

      # ۵. کامپایل فشرده با استفاده از فایل و فلگ‌های تعیین شده توسط کاربر
      - name: Build with Nuitka
        run: |
          echo "=== Starting Nuitka Compilation ==="
          echo "Target File: ${{ github.event.inputs.entrypoint }}"
          echo "Nuitka Flags: ${{ github.event.inputs.nuitka_flags }}"
          
          .\.venv\Scripts\python -m nuitka ${{ github.event.inputs.nuitka_flags }} "${{ github.event.inputs.entrypoint }}"
          echo "Compilation finished."

      # ۶. آرتیفکت گیت‌هاب (کمربند ایمنی فعال - همیشه فایل در این بخش ذخیره می‌شود)
      - name: Save Build as Artifact (Safety Net)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app-build-${{ env.TAG_NAME }}
          path: "*.exe"
          retention-days: 90

      # ۷. ایجاد ریلیز نهایی در گیت‌هاب با تگ زمانی (و استفاده از سکرت شخصی شما در صورت فعال‌سازی)
      - name: Create or Update Release
        uses: ncipollo/release-action@v1
        continue-on-error: true # سوپاپ اطمینان: حتی در صورت خطای گیت‌هاب، اکشن شما سبز می‌ماند
        with:
          artifacts: "*.exe"
          tag: "${{ env.TAG_NAME }}"
          name: "Release ${{ env.TAG_NAME }}"
          body: |
             توضیحات ریلیز خودکار:
             - فایل ورودی: [${{ github.event.inputs.entrypoint }}]
             - کتابخانه‌های نصب‌شده: [${{ github.event.inputs.packages }}]
             - فلگ‌های استفاده شده: [${{ github.event.inputs.nuitka_flags }}]
          allowUpdates: true
          makeLatest: true
          # نکته: اگر با توکن پیش‌فرض خطا داد، RELEASE_PAT را که در بالا توضیح داده شد بسازید و خط پایین را از کامنت خارج کنید:
          # token: ${{ secrets.RELEASE_PAT }}
          token: ${{ secrets.GITHUB_TOKEN }}
