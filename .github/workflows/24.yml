name: Manual Build and Release

on:
  workflow_dispatch:
    inputs:
      entrypoint:
        description: "آدرس فایل پایتون هدف برای کامپایل (مثال: app.py یا apps/app2.py)"
        required: true
        default: "app.py"

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ۱. راه‌اندازی ابزار فوق‌سریع uv همراه با مدیریت خودکار پایتون ۳.۱۲ و کش پکیج‌ها
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.12"

      # ۲. کش کردن دایرکتوری ابزارها و کدهای کامپایل‌شده C مربوط به Nuitka
      - name: Cache Nuitka Compiler and downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/Nuitka/Nuitka/Cache
          key: ${{ runner.os }}-nuitka-${{ hashFiles('**/app.py') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      # ۳. نصب پکیج‌ها
      - name: Install Dependencies
        run: |
          echo "=== Creating virtual environment with uv ==="
          uv venv
          
          echo "=== Installing packages ==="
          uv pip install pynput pystray Pillow Nuitka
          if (Test-Path requirements.txt) { 
             uv pip install -r requirements.txt
          }

      # ۴. کامپایل فشرده پروژه با استفاده از آدرس فایل وارد شده توسط کاربر
      - name: Build with Nuitka
        run: |
          echo "=== Starting Nuitka Compilation ==="
          echo "Target File: ${{ github.event.inputs.entrypoint }}"
          
          # استفاده از --output-filename=app برای ثابت ماندن نام فایل خروجی در تمام سناریوها
          .\.venv\Scripts\python -m nuitka --standalone `
                           --onefile `
                           --windows-console-mode=disable `
                           --enable-plugins=tk-inter `
                           --assume-yes-for-downloads `
                           --output-filename=app `
                           "${{ github.event.inputs.entrypoint }}"
          echo "Compilation finished."

      # ۵. آرتیفکت گیت‌هاب (کمربند ایمنی در صورت قطعی شبکه)
      - name: Save Build as Artifact (Safety Net)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app-build-${{ github.run_number }}
          path: app.exe
          retention-days: 90

      # ۶. ایجاد ریلیز نهایی در گیت‌هاب
      - name: Create or Update Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app.exe"
          tag: "build-${{ github.run_number }}"
          name: "Build #${{ github.run_number }}"
          body: "این نسخه به صورت خودکار از فایل ورودی [${{ github.event.inputs.entrypoint }}] کامپایل شده است."
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
