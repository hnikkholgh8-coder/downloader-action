name: Manual Build and Release

on:
  workflow_dispatch: # ایجاد دکمه اجرای دستی در پنل Actions

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # نسخه پایدار و کامپایل بدون مشکل با Nuitka
          check-latest: true

      - name: Install Dependencies
        run: |
          python -m venv venv
          .\venv\Scripts\python -m pip install --upgrade pip
          .\venv\Scripts\pip install pynput pystray Pillow Nuitka
          if (Test-Path requirements.txt) { .\venv\Scripts\pip install -r requirements.txt }

      - name: Build with Nuitka
        run: |
          .\venv\Scripts\python -m nuitka --standalone `
                           --onefile `
                           --windows-disable-console `
                           --enable-plugins=tk-inter `
                           --assume-yes-for-downloads `
                           app.py

      - name: Create or Update Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app.exe"
          tag: "latest"
          name: "Latest Automated Build"
          body: "این نسخه به صورت خودکار توسط GitHub Actions ساخته شده است."
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
