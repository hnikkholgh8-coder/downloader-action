name: Manual Build and Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          check-latest: true

      # ۱. کش کردن محیط مجازی پایتون (کتابخانه‌ها)
      - name: Cache Python Virtual Environment
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: venv
          key: ${{ runner.os }}-venv-${{ hashFiles('**/requirements.txt') }}-${{ hashFiles('app.py') }}
          restore-keys: |
            ${{ runner.os }}-venv-

      # ۲. نصب وابستگی‌ها فقط در صورتی که کش موجود نباشد (Cache Miss)
      - name: Install Dependencies (If Cache Missed)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          echo "No cache found or code changed. Installing dependencies..."
          python -m venv venv
          .\venv\Scripts\python -m pip install --upgrade pip
          .\venv\Scripts\pip install pynput pystray Pillow Nuitka
          if (Test-Path requirements.txt) { 
             .\venv\Scripts\pip install -r requirements.txt 
          }

      # ۳. کش کردن پوشه دانلودها و کش کامپایل C نرم‌افزار Nuitka
      - name: Cache Nuitka Cache and Downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/Nuitka/Nuitka
          key: ${{ runner.os }}-nuitka-${{ hashFiles('app.py') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Build with Nuitka
        run: |
          echo "=== Starting Nuitka Compilation ==="
          # فعال‌سازی محیط مجازی و کامپایل با استفاده از کش بهینه‌سازی شده
          .\venv\Scripts\python -m nuitka --standalone `
                           --onefile `
                           --windows-console-mode=disable `
                           --enable-plugins=tk-inter `
                           --assume-yes-for-downloads `
                           app.py
          echo "Compilation finished."

      - name: Save Build as Artifact (Safety Net)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app-build-${{ github.run_number }}
          path: app.exe
          retention-days: 90

      - name: Create or Update Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app.exe"
          tag: "build-${{ github.run_number }}"
          name: "Build #${{ github.run_number }}"
          body: "نسخه بهینه‌سازی شده با سیستم کش سرعت گیت‌هاب."
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
