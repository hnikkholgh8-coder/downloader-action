name: Manual Build and Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ۱. راه‌اندازی ابزار فوق‌سریع uv همراه با مدیریت خودکار پایتون ۳.۱۲ و کش پکیج‌ها
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.12"

      # ۲. کش کردن دایرکتوری ابزارها و کدهای کامپایل‌شده C مربوط به Nuitka (clcache)
      - name: Cache Nuitka Compiler and downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/Nuitka/Nuitka/Cache
          key: ${{ runner.os }}-nuitka-${{ hashFiles('**/app.py') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      # ۳. نصب سریع پکیج‌ها با استفاده از موتور قدرتمند uv
      - name: Install Dependencies
        run: |
          echo "=== Creating virtual environment with uv ==="
          uv venv venv
          
          echo "=== Installing packages ==="
          # استفاده از uv برای نصب آنی کتابخانه‌ها درون محیط مجازی
          uv pip install pynput pystray Pillow Nuitka --venv venv
          if (Test-Path requirements.txt) { 
             uv pip install -r requirements.txt --venv venv
          }

      # ۴. کامپایل فشرده پروژه با Nuitka (در دفعات دوم به بعد با سرعت باورنکردنی انجام می‌شود)
      - name: Build with Nuitka
        run: |
          echo "=== Starting Nuitka Compilation ==="
          .\venv\Scripts\python -m nuitka --standalone `
                           --onefile `
                           --windows-console-mode=disable `
                           --enable-plugins=tk-inter `
                           --assume-yes-for-downloads `
                           app.py
          echo "Compilation finished."

      # ۵. آرتیفکت گیت‌هاب (کمربند ایمنی در صورت قطعی شبکه)
      - name: Save Build as Artifact (Safety Net)
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app-build-${{ github.run_number }}
          path: app.exe
          retention-days: 90

      # ۶. ایجاد ریلیز نهایی در گیت‌هاب
      - name: Create or Update Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app.exe"
          tag: "build-${{ github.run_number }}"
          name: "Build #${{ github.run_number }}"
          body: "این نسخه به صورت خودکار با پایتون ۳.۱۲ و سیستم کش گیت‌هاب اکشن کامپایل شده است."
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
