name: Manual Build and Release

on:
  workflow_dispatch:

# مجوز دسترسی به اکشن جهت نوشتن و آپلود فایل در مخزن و ریلیس (حل خطای ۴۰۳)
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # راه‌اندازی پایتون ۳.۱۲ (سازگار با Nuitka)
      # ==========================================
      - name: [Log] Setup Python
        run: Write-Host "--- [INFO] Setting up Python 3.12 (Stable & Compatible) ---"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          check-latest: true

      # ==========================================
      # نصب وابستگی‌ها و کامپایل با Nuitka
      # ==========================================
      - name: [Log] Build Preparation
        run: Write-Host "--- [INFO] Creating Environment & Compiling with Nuitka ---"

      - name: Install and Build
        run: |
          Write-Host "[LOG] Creating Python Virtual Environment..."
          python -m venv venv
          
          Write-Host "[LOG] Upgrading pip to the latest version..."
          .\venv\Scripts\python -m pip install --upgrade pip
          
          Write-Host "[LOG] Installing core packages (pynput, pystray, Pillow, Nuitka)..."
          .\venv\Scripts\pip install pynput pystray Pillow Nuitka
          
          if (Test-Path requirements.txt) { 
              Write-Host "[LOG] Found requirements.txt, installing extra dependencies..."
              .\venv\Scripts\pip install -r requirements.txt 
          }
          
          Write-Host "[LOG] Executing Nuitka compilation. Please wait..."
          .\venv\Scripts\python -m nuitka --standalone `
                           --onefile `
                           --windows-disable-console `
                           --enable-plugins=tk-inter `
                           --assume-yes-for-downloads `
                           app.py
                           
          Write-Host "[SUCCESS] app.exe compiled successfully!"

      # ==========================================
      # روش اول: بارگذاری فایل در بخش ریلیس گیت‌هاب (با مجوز Write)
      # ==========================================
      - name: [Log] Creating Release
        run: Write-Host "--- [INFO] Creating GitHub Release and uploading 'app.exe' ---"

      - name: Create or Update Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app.exe"
          tag: "latest"
          name: "Latest Automated Build"
          body: "نسخه پایدار نهایی کامپایل‌شده توسط سرور گیت‌هاب اکشن."
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # روش دوم: آپلود فایل به عنوان Artifact (جهت دانلود مستقیم از صفحه اکشن)
      # ==========================================
      - name: [Log] Upload Artifact
        run: Write-Host "--- [INFO] Uploading executable as build artifact ---"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app
          path: app.exe
