name: Manual Build and Release

on:
  workflow_dispatch: # امکان اجرای دستی از تب Actions

jobs:
  build:
    runs-on: windows-latest
    
    # اضافه کردن دسترسی لازم برای آپلود فایل و ایجاد ریلیز در مخزن شما
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          check-latest: true

      - name: Install Dependencies
        run: |
          echo "=== [1/3] Start setting up Python virtual environment ==="
          python -m venv venv
          
          echo "=== [2/3] Upgrading pip ==="
          .\venv\Scripts\python -m pip install --upgrade pip
          
          echo "=== [3/3] Installing Nuitka and libraries ==="
          .\venv\Scripts\pip install pynput pystray Pillow Nuitka
          if (Test-Path requirements.txt) { 
             echo "Installing requirements.txt..."
             .\venv\Scripts\pip install -r requirements.txt 
          }
          echo "Dependencies installation completed successfully."

      - name: Build with Nuitka
        run: |
          echo "=== Starting Nuitka Compilation (This may take a few minutes) ==="
          # استفاده از فلگ اصلاح شده برای حذف هشدارهای کنسول Nuitka
          .\venv\Scripts\python -m nuitka --standalone `
                           --onefile `
                           --windows-console-mode=disable `
                           --enable-plugins=tk-inter `
                           --assume-yes-for-downloads `
                           app.py
          echo "Compilation finished. Checking output file..."
          if (Test-Path app.exe) {
             echo "Success! app.exe has been generated."
          } else {
             echo "Warning: app.exe was not found in the root folder."
          }

      - name: Create or Update Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app.exe"
          tag: "latest"
          name: "Latest Automated Build"
          body: "این نسخه به صورت خودکار با پایتون ۳.۱۲ و Nuitka کامپایل شده است."
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
